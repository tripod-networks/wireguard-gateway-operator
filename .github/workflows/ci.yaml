name: CI

on:
    push:
        branches: ["**"]

permissions:
    contents: read
    packages: write

jobs:
    lint:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 15
        steps:
            - uses: useblacksmith/checkout@v1

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.14.0

            - uses: azure/setup-helm@v5

            - name: Lint the chart
              run: helm lint k8s/charts/wireguard-gateway-operator

    unit:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: useblacksmith/checkout@v1

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Install the envtest assets
              run: echo "KUBEBUILDER_ASSETS=$(make -s envtest)" >> "$GITHUB_ENV"

            - name: Run unit tests with coverage
              run: make test-unit

            - name: Upload coverage
              uses: codecov/codecov-action@v7
              with:
                  files: ./coverage.out
                  fail_ci_if_error: false

    integration:
        runs-on: blacksmith-8vcpu-ubuntu-2404
        steps:
            - uses: useblacksmith/checkout@v1

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            # The suite renders the chart with helm to assert the shipped Ignition.
            - uses: azure/setup-helm@v5

            - name: Run integration tests
              run: make test-integration

    e2e:
        runs-on: blacksmith-8vcpu-ubuntu-2404
        # Runs take 50 to 80 minutes and the suite's own go test timeout is 120m.
        timeout-minutes: 135
        # The suite uses one fixed-name VPC per GCP project, so two runs must not overlap.
        concurrency:
            group: e2e
            cancel-in-progress: false
        steps:
            - uses: useblacksmith/checkout@v1

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            # kind binary must match the sigs.k8s.io/kind version in go.mod; the
            # library's node image uses a containerd config the runner's kind can't load.
            - uses: helm/kind-action@v1
              with:
                  version: v0.32.0
                  install_only: true

            - name: Ensure WireGuard in the runner kernel
              run: test -d /sys/module/wireguard || sudo modprobe wireguard

            - name: Write the GCP credentials file
              run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-creds.json"
              env:
                  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

            - name: Run e2e tests
              run: make test-e2e
              env:
                  E2E_MAX_ADDRESSES: 16
                  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
                  GCP_REGION: ${{ secrets.GCP_REGION }}
                  GCP_ZONE: ${{ secrets.GCP_ZONE }}
                  GCP_CREDS_FILE: ${{ runner.temp }}/gcp-creds.json

    codegen-drift:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: useblacksmith/checkout@v1

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            # mocks omitted: .mockery.yml has no packages registered yet
            - name: Regenerate code and manifests
              run: make generate manifests crossplane-models

            - name: Check for codegen drift
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      git status --porcelain
                      git diff
                      echo "generated files are out of date; run make generate manifests crossplane-models and commit" >&2
                      exit 1
                  fi

    build-and-push:
        name: Build and Push Images
        needs: [lint, unit, integration, codegen-drift]
        runs-on: blacksmith-8vcpu-ubuntu-2404
        timeout-minutes: 30
        if: github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - image: operator
                      target: operator
                    - image: link
                      target: link
        steps:
            - uses: useblacksmith/checkout@v1

            # The Dockerfile compiles inside the target platform, so arm64 needs emulation.
            - uses: docker/setup-qemu-action@v3

            - uses: useblacksmith/setup-docker-builder@v2

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
                  tags: |
                      type=sha,prefix=sha-

            - name: Build and push the image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: build/package/Dockerfile
                  target: ${{ matrix.target }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  push: true
                  platforms: linux/amd64,linux/arm64

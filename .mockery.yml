all: false
dir: "{{.InterfaceDir}}/mocks"
filename: "{{.InterfaceName}}.go"
force-file-write: true
formatter: goimports
generate: true
include-auto-generated: true
pkgname: "{{.SrcPackageName}}Mock"
log-level: info
# Interfaces are registered here as they are introduced. Each entry maps an
# import path to the interfaces whose mocks mockery should generate.
packages:
  github.com/tripod-networks/wireguard-gateway-operator/internal/gcpdiscovery:
    interfaces:
      Client:
  github.com/tripod-networks/wireguard-gateway-operator/internal/gcpmembers:
    interfaces:
      Deps:
        config:
          dir: "{{.InterfaceDir}}"
          pkgname: "{{.SrcPackageName}}"
          filename: "mock_deps_test.go"
